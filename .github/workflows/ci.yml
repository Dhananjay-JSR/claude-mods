name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Claude Code ${{ matrix.claude }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README promises, and whatever ships today.
        claude: ['2.1.287', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude }}

      - name: Show the version under test
        run: claude --version

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/intent-lens --strict

      - name: Install from the marketplace
        run: |
          claude plugin marketplace add ./
          claude plugin install intent-lens@claude-mods
          claude plugin list

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse the hooks module
        run: node --check plugins/intent-lens/hooks/register.js

      - name: Run the hook tests
        run: node plugins/intent-lens/tests/intent.test.mjs

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the SVGs parse
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --noout assets/*.svg
