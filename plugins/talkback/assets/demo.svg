<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1109 668" width="1109" height="668" role="img" aria-labelledby="title desc">
  <title id="title">talkback in a Claude Code session</title>
  <desc id="desc">A dictated question, Claude's reply with its opening paragraph marked as spoken aloud, and the row above the prompt showing that the voice is speaking, with Stop and hands-free buttons.</desc>
  <defs>
    <clipPath id="window">
      <rect width="1109" height="668" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect width="1109" height="668" fill="#282C34"/>

    <!-- title bar -->
    <circle cx="17" cy="17" r="6.5" fill="#EC6A5E"/>
    <circle cx="39" cy="17" r="6.5" fill="#F4BF4F"/>
    <circle cx="61" cy="17" r="6.5" fill="#61C554"/>
    <text x="84" y="22" fill="#C9CDD4" font-size="14" font-weight="600"
          font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">acme-web</text>

    <text x="36" y="78" fill="#FFFFFF" font-weight="700">Claude Code</text>
    <text x="36" y="100" fill="#8B929E">~/acme-web</text>

    <!-- what the person said, sent as the prompt -->
    <rect x="16" y="134" width="1077" height="26" fill="#353A44"/>
    <path d="M24 141 L30 147 L24 153" fill="none" stroke="#8B929E" stroke-width="2"/>
    <text x="40" y="153" fill="#FFFFFF">why is the login test failing?</text>

    <!-- the reply: its opening paragraph is what the voice reads -->
    <rect x="28" y="184" width="3" height="68" rx="1.5" fill="#DE7A55"/>
    <text x="44" y="202" fill="#E6E8EC">The login test fails because the session cookie is now set with</text>
    <text x="44" y="224" fill="#E6E8EC">SameSite=Strict, and the test client drops it on the redirect.</text>
    <text x="44" y="246" fill="#E6E8EC">I can relax it for the test environment only. Want me to?</text>

    <text x="44" y="290" fill="#8B929E">Where it happens</text>
    <text x="44" y="312" fill="#8B929E">- auth/session.ts:41 sets the cookie</text>
    <text x="44" y="334" fill="#8B929E">- tests/login.spec.ts:18 follows the redirect</text>

    <!-- notes on the picture, not part of the terminal -->
    <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="806" y="131" width="270" height="32" rx="16" fill="#1A1614" stroke="#DE7A55" stroke-width="1.5"/>
      <rect x="826" y="138" width="8" height="13" rx="4" fill="#FFE7D8"/>
      <path d="M822 147 A8 8 0 0 0 838 147 M830 155 V158" fill="none" stroke="#FFE7D8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="848" y="152" fill="#FFE7D8">said aloud, sent after a pause</text>

      <rect x="806" y="202" width="270" height="32" rx="16" fill="#1A1614" stroke="#DE7A55" stroke-width="1.5"/>
      <g stroke="#FFE7D8" stroke-width="2.6" stroke-linecap="round">
        <path d="M822 215 V221"/>
        <path d="M827 211 V225"/>
        <path d="M832 208 V228"/>
        <path d="M837 212 V224"/>
        <path d="M842 215 V221"/>
      </g>
      <text x="854" y="223" fill="#FFE7D8">spoken as it is written</text>
    </g>

    <!-- talkback's row above the prompt -->
    <rect x="42" y="537" width="8" height="12" rx="4" fill="#DE7A55"/>
    <path d="M38 545 A8 8 0 0 0 54 545 M46 553 V556" fill="none" stroke="#DE7A55" stroke-width="1.8" stroke-linecap="round"/>
    <text x="64" y="552" fill="#8B929E">Voice replies on</text>
    <path d="M250 540 L256 546 L250 552 L244 546 Z" fill="#5FC4D4"/>
    <text x="264" y="552" fill="#5FC4D4">speaking</text>
    <text x="372" y="552" fill="#E6E8EC">[ Stop ]</text>
    <text x="474" y="552" fill="#E6E8EC">[ Mic on: hands-free ]</text>

    <!-- prompt box -->
    <line x1="16" y1="578" x2="1093" y2="578" stroke="#5A606B"/>
    <path d="M24 594 L30 600 L24 606" fill="none" stroke="#8B929E" stroke-width="2"/>
    <rect x="40" y="590" width="10" height="20" fill="#FFFFFF"/>
    <line x1="16" y1="622" x2="1093" y2="622" stroke="#5A606B"/>
    <path d="M36 639 L44 644 L36 649 Z M46 639 L54 644 L46 649 Z" fill="#E5C07B"/>
    <text x="64" y="650" fill="#E5C07B">auto mode on</text>
    <text x="196" y="650" fill="#8B929E">(shift+tab to cycle)</text>
  </g>
</svg>
