<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" role="img" aria-labelledby="title desc">
  <title id="title">intent-lens in a Claude Code session</title>
  <desc id="desc">The band above the prompt shows three intents: a Bash build, a model-phrased edit, and a red warning before a recursive delete.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1A18"/>
      <stop offset="1" stop-color="#161413"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="760" height="248" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="760" height="248" fill="url(#card)"/>
    <rect x="1" y="1" width="758" height="246" rx="17" fill="none"
          stroke="#ffffff" stroke-opacity="0.09"/>

    <!-- title bar -->
    <circle cx="28" cy="26" r="5" fill="#E0604D"/>
    <circle cx="48" cy="26" r="5" fill="#DFA23C"/>
    <circle cx="68" cy="26" r="5" fill="#5FB268"/>
    <text x="732" y="30" text-anchor="end" fill="#9A9088" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">intent-lens</text>
    <line x1="0" y1="48" x2="760" y2="48" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- markers are paths, so no symbol font or emoji can recolor them -->
    <path d="M29 79 L44 85 L29 91 Z" fill="#5FC4D4" stroke="#5FC4D4"
          stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M36 113 C 36.8 118.8 37.2 119.2 44 121 C 37.2 122.8 36.8 123.2 36 129
             C 35.2 123.2 34.8 122.8 28 121 C 34.8 119.2 35.2 118.8 36 113 Z"
          fill="#C58AF9"/>
    <path d="M36 149.5 L45.5 165.5 L26.5 165.5 Z" fill="#FF6B6B"
          stroke="#FF6B6B" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="35.2" y="154.4" width="1.6" height="6" rx="0.8" fill="#1A1614"/>
    <rect x="35.2" y="162" width="1.6" height="1.6" rx="0.8" fill="#1A1614"/>

    <!-- intent rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="56" y="90" fill="#5FC4D4" font-weight="600">Bash</text>
      <text x="104" y="90" fill="#B3A89E">tidy up the build output</text>

      <text x="56" y="126" fill="#C58AF9" font-weight="600">Edit</text>
      <text x="104" y="126" fill="#B3A89E">Add a null guard to the token parser</text>

      <text x="56" y="162" fill="#FF6B6B" font-weight="600">Bash</text>
      <text x="104" y="162" fill="#B3A89E">delete files recursively</text>
    </g>

    <!-- prompt box -->
    <rect x="20" y="186" width="720" height="42" rx="9" fill="#121010"
          stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="38" y="213" fill="#8A817A" font-size="14"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt;</text>
    <rect x="56" y="200" width="8" height="16" rx="1.5" fill="#D97757"/>
    <text x="74" y="213" fill="#8A817A" font-size="14"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Type a message…</text>
  </g>
</svg>
